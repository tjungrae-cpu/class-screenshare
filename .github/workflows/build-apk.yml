name: 갤럭시탭 앱(APK) 빌드

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk hatban-screenshare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hatban-screenshare-apk
          path: hatban-screenshare.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: 학생 화면 공유 앱 v1.0.${{ github.run_number }}
          body: 갤럭시탭(안드로이드)용 학생 화면 공유 앱입니다. 아래 hatban-screenshare.apk 를 받아 설치하세요.
          files: hatban-screenshare.apk
          make_latest: true
